<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>login</title>
</head>
<body>
    <section style="background-color: #eef0ff; font-family: Arial, Helvetica, sans-serif;"></section>
        <form action="#" method="POST" style="text-align: left;"></form>
            <div style="text-align: center; width: 300px; height: 440px; margin: auto; background-color: #ffffff; border-radius: 10px; padding: 10px;">
                <h1 style="text-align: center; font-family: Arial, Helvetica, sans-serif;">Log in</h1>
                <p style="font-weight: bold; font-family: Arial, Helvetica, sans-serif;">Don't have an account? <a href="#">sign Up</a>
                </p>
                <div style="text-align: center;">
                    <button type="button" style="display: inline-block; border-radius: 5px; border: 1px solid #ddd; background-color: #ffffff; width: 240px; height: 40px; line-height: 40px;"><img style="vertical-align: middle;" src="./imges/google_icon.png" alt="google icon" height="30px">Sign in with Google</button>
                    <button type="button" style="display: inline-block; border-radius: 5px; border: 2px solid #4351d3; background-color: #ffffff; width: 40px; height: 40px; text-align: center; line-height: 40px;">
                        <img src="./imges/fb_icon.png" alt="facebook icon" height="26px" style="vertical-align: middle;">
                    </button>
                </div>
            </div>
            
            <div style="text-align: center; margin: 15px 0;">
                <hr style="width: 40%; display: inline-block; vertical-align: middle; border: none; border-top: 1px solid #ccc;">
                <span style="margin: 0 10px; display: inline-block; vertical-align: middle;">or</span>
                <hr style="width: 40%; display: inline-block; vertical-align: middle; border: none; border-top: 1px solid #ccc;">
            </div>
                
             <label style="color: grey; font-size: 13px;">Email</label><br>

            <div>
                <input type="email" placeholder="Enter Email" style="width: 100%; box-sizing: border-box; padding: 8px 30px 8px 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
                <span style="position: absolute; right: 10px; top: 8px;">&#8942;</span>
            </div>
        
            <label style="color: grey; font-size: 13px;">Password</label><br>

            <div>
                <input type="password" placeholder="Enter Password" style="width: 100%; box-sizing: border-box;padding: 8px 30px 8px 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
                <span style="position: absolute; right: 10px; top: 8px;">&#8942;</span>
            </div>
        
            <button type="submit" style="width: 100%; padding: 10px; background-color: #574ad7; color: white; border: none; border-radius: 5px;">Log In</button>
            
            <p style="text-align: center; margin-top: 15px;"><a href="#">Forgot password?</a></p>
            
        </form>
    </section>
</body>
</html>
